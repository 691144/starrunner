<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#03050a"/>
    </linearGradient>
    <linearGradient id="wl" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#cfd6df"/>
      <stop offset="1" stop-color="#5d6672"/>
    </linearGradient>
    <linearGradient id="wr" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#4a525d"/>
      <stop offset="1" stop-color="#1c2129"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd38a"/>
      <stop offset="0.4" stop-color="#ff8a2a" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#ff6a1a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="0" fill="url(#sky)"/>
  <g fill="#fff">
    <circle cx="200" cy="70" r="2"/><circle cx="290" cy="110" r="1.5"/><circle cx="245" cy="45" r="1.2"/>
    <circle cx="320" cy="60" r="2"/><circle cx="215" cy="135" r="1.3"/><circle cx="270" cy="160" r="1.6"/>
  </g>
  <!-- trench walls converging to vanishing point -->
  <polygon points="0,0 236,180 236,300 0,512" fill="url(#wl)"/>
  <polygon points="512,0 276,180 276,300 512,512" fill="url(#wr)"/>
  <polygon points="0,512 236,300 276,300 512,512" fill="#2a3038"/>
  <!-- greeble bands -->
  <g stroke="#0a0d12" stroke-width="6" opacity="0.55">
    <line x1="0" y1="120" x2="236" y2="214"/><line x1="0" y1="260" x2="236" y2="248"/><line x1="0" y1="390" x2="236" y2="280"/>
    <line x1="512" y1="150" x2="276" y2="222"/><line x1="512" y1="330" x2="276" y2="262"/>
  </g>
  <g fill="#ffb547">
    <rect x="70" y="180" width="18" height="6"/><rect x="140" y="230" width="12" height="4"/><rect x="430" y="250" width="16" height="5"/>
    <rect x="190" y="262" width="8" height="3"/><rect x="360" y="232" width="10" height="4"/>
  </g>
  <!-- runway lights -->
  <g fill="#ffb547">
    <rect x="160" y="470" width="30" height="8"/><rect x="322" y="470" width="30" height="8"/>
    <rect x="203" y="390" width="18" height="5"/><rect x="291" y="390" width="18" height="5"/>
    <rect x="226" y="335" width="10" height="3"/><rect x="276" y="335" width="10" height="3"/>
  </g>
  <!-- ship: forward-swept interceptor seen from behind -->
  <g transform="translate(256 318)">
    <circle cx="-70" cy="8" r="34" fill="url(#glow)"/>
    <circle cx="70" cy="8" r="34" fill="url(#glow)"/>
    <polygon points="-18,-6 -96,4 -100,14 -18,10" fill="#d8dde2"/>
    <polygon points="18,-6 96,4 100,14 18,10" fill="#d8dde2"/>
    <polygon points="-62,4 -40,1 -40,6 -62,9" fill="#ff6a1a"/>
    <polygon points="62,4 40,1 40,6 62,9" fill="#ff6a1a"/>
    <rect x="-84" y="-2" width="28" height="22" rx="11" fill="#2b3038"/>
    <rect x="56" y="-2" width="28" height="22" rx="11" fill="#2b3038"/>
    <circle cx="-70" cy="9" r="8" fill="#ffe2b0"/>
    <circle cx="70" cy="9" r="8" fill="#ffe2b0"/>
    <polygon points="0,-34 22,-6 16,16 -16,16 -22,-6" fill="#e6e9ed"/>
    <polygon points="0,-30 10,-12 0,-6 -10,-12" fill="#0d2538"/>
    <rect x="-3" y="-52" width="6" height="22" fill="#d8dde2"/>
  </g>
</svg>
